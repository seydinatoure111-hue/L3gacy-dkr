<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="L3GACY Admin">
<title>L3GACY — Activer les notifications</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  body{
    background:#0B0B0B;color:#F4F4F2;font-family:sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:30px 20px;margin:0;
  }
  button{
    padding:16px 30px;background:#F4F4F2;color:#0B0B0B;border:none;
    font-size:15px;font-weight:700;border-radius:2px;margin-top:20px;
    width:100%;max-width:320px;
  }
  button:disabled{opacity:0.5;}
  p{color:#8B8B8B;max-width:32ch;margin-top:14px;font-size:14px;}
  #status{color:#F4F4F2;font-weight:600;white-space:pre-wrap;text-align:left;
    background:#161616;padding:14px;border-radius:6px;margin-top:20px;
    max-width:320px;font-size:12.5px;font-family:monospace;}

  .orders-section{margin-top:50px;width:100%;max-width:420px;text-align:left;}
  .orders-section h2{font-size:16px;text-align:center;color:#F4F4F2;margin-bottom:12px;}
  #admin-code{
    width:100%;padding:12px;background:#161616;border:1px solid #2A2A2A;color:#F4F4F2;
    border-radius:6px;font-size:14px;box-sizing:border-box;margin-bottom:10px;
  }
  #load-orders-btn{margin-top:0;}
  .order-card{
    background:#161616;border-radius:8px;padding:14px;margin-top:12px;
    font-size:13px;line-height:1.5;
  }
  .order-card .order-status{
    display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;
    margin-bottom:6px;
  }
  .status-PAYE{background:#1f5c2e;color:#c9f7d3;}
  .status-PENDING{background:#5c4a1f;color:#f7e8c9;}
  .status-ECHEC{background:#5c1f1f;color:#f7c9c9;}
  #orders-list{max-height:60vh;overflow-y:auto;}
  #orders-msg{font-size:13px;color:#8B8B8B;margin-top:10px;text-align:center;}
</style>
</head>
<body>
  <h1>Notifications commandes L3GACY</h1>
  <p>Ouvre cette page depuis l'icône sur ton écran d'accueil (pas depuis Safari), puis appuie sur le bouton.</p>
  <button id="activate-btn">Activer les notifications</button>
  <p id="status"></p>

  <div class="orders-section">
    <h2>Historique des commandes</h2>
    <input type="password" id="admin-code" placeholder="Code admin">
    <button id="load-orders-btn">Voir les commandes</button>
    <p id="orders-msg"></p>
    <div id="orders-list"></div>
  </div>

<script>
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('activate-btn');
  const BACKEND_URL = "https://l3gacy-dkr.onrender.com";

  function log(msg){
    statusEl.textContent += msg + "\n";
  }

  // Détection : est-on bien lancé depuis l'écran d'accueil (mode standalone) ?
  const isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if (isIOS && !isStandalone) {
    log("⚠️ Tu es dans Safari, pas dans l'appli ajoutée à l'écran d'accueil.\nSur iPhone, les notifications ne marchent QUE si tu ouvres cette page depuis l'icône sur ton écran d'accueil.\n\n1. Partage → Sur l'écran d'accueil\n2. Ferme Safari\n3. Ouvre l'icône ajoutée\n4. Reviens ici et appuie sur le bouton");
  } else {
    log("Mode standalone : " + isStandalone + " — OK, tu peux continuer.");
  }

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    log("Bouton cliqué, chargement de OneSignal...");
    try {
      if (typeof OneSignal === 'undefined' && !window.OneSignalDeferred) {
        log("❌ OneSignal ne s'est pas chargé du tout (script bloqué ?).");
        btn.disabled = false;
        return;
      }
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          log("SDK chargé, initialisation...");
          await OneSignal.init({ appId: "f5bbf5d7-99a1-43e1-84a5-ddad96c9e2b1" });
          log("Initialisé. Demande de permission...");

          const permission = await OneSignal.Notifications.requestPermission();
          log("Résultat permission : " + permission);

          await OneSignal.login('l3gacy-admin');
          log("✅ Notifications activées et liées à cet appareil.");
        } catch (err) {
          log("❌ Erreur pendant l'init/permission : " + (err && err.message ? err.message : JSON.stringify(err)));
        } finally {
          btn.disabled = false;
        }
      });
    } catch (err) {
      log("❌ Erreur générale : " + (err && err.message ? err.message : JSON.stringify(err)));
      btn.disabled = false;
    }
  });

  // --- Historique des commandes ---
  const codeInput = document.getElementById('admin-code');
  const loadBtn = document.getElementById('load-orders-btn');
  const ordersMsg = document.getElementById('orders-msg');
  const ordersList = document.getElementById('orders-list');

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function renderOrders(orders){
    ordersList.innerHTML = '';
    if (!orders.length) {
      ordersMsg.textContent = 'Aucune commande pour le moment.';
      return;
    }
    ordersMsg.textContent = orders.length + ' commande(s)';
    orders.forEach(o => {
      const c = o.customer || {};
      const itemsText = (o.items || []).map(i => `${escapeHtml(i.title)} (${escapeHtml(i.color)})`).join(', ');
      const date = o.created_at ? new Date(o.created_at).toLocaleString('fr-FR') : '';
      const div = document.createElement('div');
      div.className = 'order-card';
      div.innerHTML = `
        <span class="order-status status-${escapeHtml(o.status)}">${escapeHtml(o.status)}</span><br>
        <b>${itemsText}</b><br>
        💰 ${escapeHtml(o.amount)} FCFA — ${escapeHtml(o.payment_method || '')}<br>
        👤 ${escapeHtml(c.name)}<br>
        📞 ${escapeHtml(c.phone)}<br>
        📍 ${escapeHtml(c.address) || 'adresse non renseignée'}<br>
        <span style="color:#666;font-size:11px;">${date}</span><br>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;">
          <input type="checkbox" class="delivered-checkbox" data-id="${escapeHtml(o.transaction_id)}" ${o.delivered ? 'checked' : ''}>
          Commande livrée
        </label>
      `;
      ordersList.appendChild(div);
    });

    document.querySelectorAll('.delivered-checkbox').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id = cb.dataset.id;
        const code = codeInput.value.trim();
        cb.disabled = true;
        try {
          await fetch(`${BACKEND_URL}/api/orders/${id}/delivered?secret=${encodeURIComponent(code)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ delivered: cb.checked })
          });
        } catch (err) {
          alert('Erreur lors de la mise à jour.');
          cb.checked = !cb.checked;
        }
        cb.disabled = false;
      });
    });
  }

  loadBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if (!code) {
      ordersMsg.textContent = 'Entre le code admin d\'abord.';
      return;
    }
    try { localStorage.setItem('l3gacy_admin_code', code); } catch(e){}
    loadOrders(code);
  });

  async function loadOrders(code){
    ordersMsg.textContent = 'Chargement...';
    ordersList.innerHTML = '';
    try {
      const res = await fetch(`${BACKEND_URL}/api/orders?secret=${encodeURIComponent(code)}`);
      if (res.status === 401) {
        ordersMsg.textContent = '❌ Code admin incorrect.';
        return;
      }
      if (!res.ok) {
        ordersMsg.textContent = '❌ Erreur serveur.';
        return;
      }
      const orders = await res.json();
      renderOrders(orders);
    } catch (err) {
      ordersMsg.textContent = '❌ Impossible de charger les commandes.';
    }
  }

  // Au chargement de la page : si un code est déjà enregistré sur cet appareil, on recharge direct
  try {
    const savedCode = localStorage.getItem('l3gacy_admin_code');
    if (savedCode) {
      codeInput.value = savedCode;
      loadOrders(savedCode);
    }
  } catch(e){}
</script>
</body>
</html>
